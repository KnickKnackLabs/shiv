[settings]
quiet = true
task_output = "interleave"
experimental = true
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
"shiv:codebase" = "0.3"
"shiv:readme" = "latest"
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.1"
gum = "0.17.0"
uv = "0.11.15"
jsonschema = "14.14.2"
"aqua:shenwei356/rush" = "0.9.0"

[_.codebase]
lint = [
  "mise-settings",
  "bats-test-helper",
  "mcr-scope",
  "or-true",
  "shellcheck",
  "gum-table",
]

[_.codebase.scope]
gum-table = ".mise/tasks"
